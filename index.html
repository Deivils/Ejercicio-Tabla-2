<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas 2</title>
</head>
<body>
    <h3>Fusión de Columnas</h3>
    <table border="1" width="300" style="text-align: center;">
        <tr>
            <td colspan="3" style="background-color: red;">A</td>
            <td>B</td>
        </tr>
        <tr>
            <td>C</td>
            <td colspan="2" style="background-color: red;">D</td>
            <td>E</td>
        </tr>
        <tr>
            <td colspan="4" style="background-color: red;">F</td>
        </tr>

        <tr>
            <td>G</td>
            <td>H</td>
            <td>I</td>
            <td>J</td>
        </tr>
    </table>
    <br>
    <br>
    <h3>Fusión de Filas</h3>
    <table border="1" width="300" style="text-align: center;">
        <tr>
            <td>A</td>
            <td>B</td>
            <td rowspan="3" style="background-color: red;">C</td>
            <td>D</td>
        </tr>
        <td rowspan="2" style="background-color: red;">E</td>
        <td>F</td>
        <td rowspan="3" style="background-color: red;">G</td>

        <tr>
            <td>H</td>
        </tr>

        <tr>
            <td>I</td>
            <td>J</td>
            <td>K</td>
        </tr>
    </table>
</body>
</html>
